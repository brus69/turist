{% extends "base.html" %}
{% block title %}ЛК — Создать тур{% endblock %}
{% block content %}
<div class="container section cabinet-grid">
  {% include "cabinet/_nav.html" %}
  <div>
    <h1 style="font-size:1.35rem;">{{ cabinet_title }}</h1>
    <p class="muted mt-sm">Основные поля — без отправки в API.</p>
    <form class="mt-md" style="max-width:520px;" method="get" action="#">
      <div class="field"><label>Название</label><input type="text" name="title"></div>
      <div class="field mt-md"><label>Регион</label><input type="text" name="region"></div>
      <div class="field mt-md"><label>Дней</label><input type="number" name="days" value="3" min="1"></div>
      <div class="field mt-md"><label>Цена, ₽</label><input type="number" name="price" value="7900" min="0"></div>
      <div class="field mt-md"><label>Описание</label><textarea name="desc" rows="5" style="width:100%;"></textarea></div>
      <button type="button" class="btn btn--primary mt-md" disabled>Сохранить черновик</button>
    </form>
  </div>
</div>
{% endblock %}
